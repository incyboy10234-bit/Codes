<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#12a89d">
<meta name="description" content="A private notes app for your own devices.">
<title>My Notes</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notes">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div id="app" class="app" data-pane="list">

  <!-- ───────────────────────── sidebar ───────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <header class="side-head">
      <div class="brand">
        <img src="./icons/icon-192.png" alt="" width="28" height="28">
        <span>My Notes</span>
      </div>
      <button class="icon-btn only-mobile" data-act="close-sidebar" title="Close">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <nav class="side-scroll">
      <ul class="side-list" id="smartList"></ul>

      <div class="side-section">
        <span class="side-title">Notebooks</span>
        <button class="icon-btn sm" data-act="new-notebook" title="New notebook">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <ul class="side-list" id="notebookList"></ul>

      <div class="side-section"><span class="side-title">Tags</span></div>
      <ul class="side-list" id="tagList"></ul>
    </nav>

    <footer class="side-foot">
      <button class="side-btn" data-act="open-transfer">
        <svg viewBox="0 0 24 24"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M12 3v13M7 8l5-5 5 5"/></svg>
        <span>Transfer &amp; Sync</span>
      </button>
      <button class="side-btn" data-act="open-settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4.5 15H4a2 2 0 1 1 0-4h.2A1.6 1.6 0 0 0 5.3 8.2l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 11 4.5V4a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.3.9z"/></svg>
        <span>Settings</span>
      </button>
    </footer>
  </aside>

  <!-- ───────────────────────── note list ───────────────────────── -->
  <section class="listpane" id="listpane">
    <header class="list-head">
      <button class="icon-btn only-mobile" data-act="open-sidebar" title="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24" class="search-ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search notes…" autocomplete="off" spellcheck="false">
        <button class="icon-btn sm hidden" id="clearSearch" title="Clear">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <button class="icon-btn" data-act="toggle-view" id="viewBtn" title="List / grid view">
        <svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></svg>
      </button>
      <button class="icon-btn" data-act="open-sort" title="Sort">
        <svg viewBox="0 0 24 24"><path d="M3 6h13M3 12h9M3 18h5M17 8v11m0 0 3-3m-3 3-3-3"/></svg>
      </button>
    </header>

    <div class="list-scope" id="listScope"></div>
    <div class="notes" id="notes"></div>
    <div class="empty hidden" id="listEmpty"></div>

    <button class="fab" data-act="new-note" title="New note">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </section>

  <!-- ───────────────────────── editor ───────────────────────── -->
  <section class="editorpane" id="editorpane">
    <div class="ed-empty" id="edEmpty">
      <img src="./icons/icon-192.png" alt="" width="64" height="64">
      <h2>Nothing open</h2>
      <p>Pick a note on the left, or start a new one.</p>
      <button class="btn primary" data-act="new-note">New note</button>
    </div>

    <div class="ed-wrap hidden" id="edWrap">
      <header class="ed-head">
        <button class="icon-btn only-mobile" data-act="back-to-list" title="Back">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="crumb" id="crumb"></div>
        <div class="ed-head-actions">
          <span class="saved" id="savedFlag">Saved</span>
          <button class="icon-btn" data-act="toggle-pin" id="pinBtn" title="Pin">
            <svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/></svg>
          </button>
          <button class="icon-btn" data-act="open-note-menu" title="More">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
        </div>
      </header>

      <div class="toolbar" id="toolbar"></div>

      <div class="ed-scroll" id="edScroll">
        <input class="ed-title" id="edTitle" placeholder="Title" autocomplete="off">
        <div class="ed-meta" id="edMeta"></div>
        <div class="ed-tags" id="edTags"></div>
        <div class="ed-body" id="edBody" contenteditable="true" spellcheck="true"
             role="textbox" aria-multiline="true" aria-label="Note body"></div>
      </div>
    </div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet-host" id="sheetHost"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="filePicker" hidden multiple>

<script src="./js/vendor/qrcode.min.js"></script>
<script src="./js/db.js"></script>
<script src="./js/editor.js"></script>
<script src="./js/transfer.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
